site_name: shipzil
site_description: One shipping interface across EasyPost, Shippo, ShipStation and Easyship, with multi-parcel support on all of them.
site_author: Sameer Kumar

# GitHub Pages for the repo `sameerkumar18/shipzil` serves at this path. To move
# the docs to shipzil.com, set site_url to https://shipzil.com/ and put that
# domain in docs/CNAME — nothing else changes. `shipzil.github.io` would require
# a GitHub *organisation* named `shipzil`, which does not exist yet.
site_url: https://sameerkumar18.github.io/shipzil/
repo_url: https://github.com/sameerkumar18/shipzil
repo_name: sameerkumar18/shipzil
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Guides:
      - Providers: providers.md
      - International shipping: international.md
      - Errors and exclusions: errors.md
  - Reference: reference.md
  - Roadmap: roadmap.md
  - Provider research:
      - Why this section exists: research.md
      - API reality: API-REALITY.md
      - Gaps: GAPS.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

# Fail the build on a broken internal link rather than shipping one.
strict: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sameerkumar18/shipzil
