[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipzil"
dynamic = ["version"]
description = "OpenRouter for Shipping: one Python interface across Shippo, ShipStation and Easyship."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sameer Kumar", email = "sam@sameerkumar.website" }]
keywords = ["shipping", "parcel", "shippo", "shipstation", "easyship", "logistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
# Zero runtime dependencies, deliberately. Standard library only.
dependencies = []

[project.urls]
Repository = "https://github.com/sameerkumar18/shipzil"
Issues = "https://github.com/sameerkumar18/shipzil/issues"
Documentation = "https://sameerkumar18.github.io/shipzil/"

# PEP 735 dependency groups. Not installed by consumers, unlike
# optional-dependencies, and what `uv sync` picks up by default.
[dependency-groups]
dev = [
  "ruff>=0.16",
  "pytest>=9.1",
  "mypy>=2.3",
]

# Single source of truth for the version, so pyproject and __init__ cannot drift.
[tool.hatch.version]
path = "shipzil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["shipzil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real provider sandboxes; requires credentials in .env"]

[tool.ruff]
line-length = 100
# Lint against the oldest supported version.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE", "PTH"]

[tool.mypy]
# Matches requires-python, so the type checker verifies the real floor.
python_version = "3.10"
strict = true
warn_return_any = false
