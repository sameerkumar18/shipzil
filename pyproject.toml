[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipzil"
version = "0.1.0"
description = "One shipping interface across EasyPost, Shippo, ShipStation and Easyship, with multi-parcel support on all of them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sameer Kumar", email = "sam@sameerkumar.website" }]
keywords = ["shipping", "parcel", "easypost", "shippo", "shipstation", "easyship", "logistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
# Zero runtime dependencies, deliberately. Standard library only.
dependencies = []

[project.urls]
Repository = "https://github.com/sameerkumar18/shipzil"
Issues = "https://github.com/sameerkumar18/shipzil/issues"

# PEP 735 dependency groups. Not installed by consumers, unlike
# optional-dependencies, and what `uv sync` picks up by default.
# The library runs on 3.9; the dev toolchain does not. mypy and modern pytest
# both dropped 3.9, so they are gated by marker rather than dragging the
# library's floor up to match them. 3.9 compatibility is verified in an
# isolated env — see `make check-compat` / the matrix in CONTRIBUTING.
[dependency-groups]
dev = [
  "ruff>=0.16",
  "pytest>=9.1; python_version >= '3.10'",
  "pytest>=8,<9; python_version < '3.10'",
  "mypy>=2.3; python_version >= '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["shipzil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real provider sandboxes; requires credentials in .env"]

[tool.ruff]
line-length = 100
# Lint against the oldest supported version so a 3.10+ idiom cannot slip in.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE", "PTH"]

[tool.mypy]
# mypy itself refuses to target 3.9 (minimum is 3.10), so it cannot verify the
# actual floor. 3.9 compatibility is enforced by ruff's target-version = "py39"
# plus a real test run on 3.9 — see CONTRIBUTING.
python_version = "3.10"
strict = true
warn_return_any = false
