[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipzil"
version = "0.1.0"
description = "One honest shipping interface across EasyPost, Shippo, ShipStation and Easyship — multi-parcel everywhere, even where the provider can't."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sameer Kumar" }]
keywords = ["shipping", "parcel", "easypost", "shippo", "shipstation", "easyship", "logistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://shipzil.com"

[tool.hatch.build.targets.wheel]
packages = ["shipzil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real provider sandboxes; requires credentials in .env"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
