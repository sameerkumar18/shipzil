name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "shipzil/**"
      - "AGENTS.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "shipzil/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Always build, on every branch and PR. Type generation, static generation and
  # the agent-output checks all run before anything can be deployed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci
        working-directory: docs-site
      - run: npm run types:check
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - run: npm run check:agent
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs-site/out

  # Deploy only from main. Requires Pages enabled with source "GitHub Actions".
  # Note: Pages on a private repository needs a paid plan.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
